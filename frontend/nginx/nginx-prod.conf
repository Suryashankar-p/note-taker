worker_processes auto;

events {}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 1000M;

    server {
        listen 80;
        server_name localhost;

        location /genaistudio/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /genaistudio/index.html;
        }
    }
}
