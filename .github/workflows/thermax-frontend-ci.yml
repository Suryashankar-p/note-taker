name: Thermax Frontend Deployment

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:
      branch:
        description: 'Select the branch to deploy'
        required: true
        type: choice
        options:
          - main
          - development

env:
  ACR_NAME: tmxgenaidacr01
  IMAGE_NAME: thermax_frontend
  RESOURCE_GROUP: Tmx_Genai_Dev_RG
  CONTAINER_APP_NAME: tmxgenaidaca03
  IMAGE_TAG: v16

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_ENABLE_SSO=true \
            --build-arg VITE_FIRST_USER_EMAIL=admin@example.com \
            --build-arg VITE_DOMAIN=thermaxglobal.com \
            --build-arg VITE_URL_PREFIX=/ \
            --build-arg VITE_BACKEND_SSO_URL=https://devmobility.thermaxglobal.com/genaistudio/ \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG ./frontend

      - name: Push Docker image to ACR
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG
